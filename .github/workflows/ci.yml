name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Qt QML test runtime and released backend
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick qml6-module-qtqml-workerscript
          python3 -m pip install nstream==1.48.0
      - name: helper, QML action and real protocol tests
        env:
          NSTREAM_CONTRACT_TEST: "1"
          NSTREAM_REQUIRE_QML_TESTS: "1"
          QMLTESTRUNNER: /usr/lib/qt6/bin/qmltestrunner
        run: python3 -B -m unittest discover -s tests
      - name: manifest and catalogs
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          m = json.loads(pathlib.Path("manifest.json").read_text())
          assert m["schemaVersion"] == 1 and m["id"] == "gianlucamazza.nstream"
          assert pathlib.Path(m["entryPoints"]["barWidget"]).is_file()
          cats = {p.stem: json.loads(p.read_text()) for p in pathlib.Path("i18n").glob("*.json")}
          keys = set(cats["en"])
          assert all(set(c) == keys for c in cats.values()), "i18n catalogs differ"
          used = set(re.findall(r'tr\.tn?\("([^"]+)"', pathlib.Path("Panel.qml").read_text()))
          assert used <= keys, used - keys
          assert not any(p.is_symlink() for p in pathlib.Path(".").rglob("*"))
          PY
